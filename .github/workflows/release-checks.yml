name: Release checks
on:
  push:
    branches: [main, codex/tmlr-release-refresh]
  pull_request:
permissions:
  contents: read
jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements/evaluation.txt
      - name: Verify bundled evidence
        run: python tools/verify_release.py
      - name: Test CLI, checkpoint loading and OCR metrics
        run: python -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check
